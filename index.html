<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — APIs, Books, Weather + AI</title>
<style>
body{margin:0;background:#070a12;color:#fff;font-family:sans-serif}
.top{padding:15px;background:#0e1422;border-bottom:1px solid #222}
.section{padding:20px}
#aiButton{position:fixed;bottom:20px;right:20px;background:#8b6cff;color:#fff;padding:14px;border-radius:50%;cursor:pointer;font-size:20px;z-index:999}
#aiChat{position:fixed;bottom:80px;right:20px;width:320px;height:420px;background:#0e1422;border:1px solid #333;border-radius:10px;display:none;flex-direction:column;z-index:999}
#messages{flex:1;overflow:auto;padding:10px;font-size:13px}
input{outline:none}
button{cursor:pointer}
</style>
</head>
<body>

<div class="top"><b>Atlas</b> — APIs + Books + Weather + AI</div>

<div class="section">
<h2>🌐 Public APIs</h2>
<p>Browse APIs like Open-Meteo, NASA, REST Countries.</p>
</div>

<div class="section">
<h2>📚 Books Library</h2>
<p>Powered by Project Gutenberg (Gutendex).</p>
</div>

<div class="section">
<h2>🌤 Weather</h2>
<input id="city" placeholder="Enter city">
<button onclick="getWeather()">Check</button>
<div id="weather"></div>
</div>

<!-- AI BUTTON -->
<div id="aiButton">💬</div>

<!-- AI CHAT -->
<div id="aiChat">
  <div style="padding:10px;background:#1a2238;">Atlas AI</div>
  <div id="messages"></div>
  <div style="display:flex;">
    <input id="userInput" placeholder="Ask anything..." style="flex:1;padding:10px;border:none;">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
// WEATHER
async function getWeather(){
 const city=document.getElementById("city").value;
 const geo=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+city);
 const gj=await geo.json();
 const p=gj.results?.[0];
 if(!p) return alert("City not found");
 const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m`);
 const j=await w.json();
 document.getElementById("weather").innerHTML="Temp: "+j.current.temperature_2m+"°C";
}

// AI CHAT
const btn=document.getElementById("aiButton");
const chat=document.getElementById("aiChat");
const messages=document.getElementById("messages");

btn.onclick=()=>{chat.style.display=chat.style.display==="flex"?"none":"flex";};

async function sendMessage(){
 const input=document.getElementById("userInput");
 const text=input.value;
 if(!text) return;

 messages.innerHTML+="<div><b>You:</b> "+text+"</div>";
 input.value="";

 const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{
  method:"POST",
  headers:{
   "Authorization":"Bearer YOUR_API_KEY",
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   model:"openrouter/free",
   messages:[{role:"user",content:text}]
  })
 });

 const data=await res.json();
 const reply=data.choices?.[0]?.message?.content||"No response";

 messages.innerHTML+="<div><b>AI:</b> "+reply+"</div>";
}
</script>

</body>
</html>
