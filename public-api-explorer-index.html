<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Discover, search and filter public APIs.">
<title>Public API Explorer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7fb;color:#172033}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px max(14px,calc((100% - 1180px)/2));background:#fff;border-bottom:1px solid #e6e8ee}
.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:#111827;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}.brand small{display:block;color:#718096}
main{max-width:1180px;margin:auto;padding:28px 16px 50px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:end;padding:20px 0 24px}.eyebrow{color:#635bff;font-size:12px;font-weight:800;letter-spacing:.15em}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.04em;margin:8px 0 14px}.hero p{color:#667085;font-size:17px}.search{background:#fff;border:1px solid #dfe3ea;border-radius:16px;padding:14px;display:flex;gap:8px;box-shadow:0 10px 30px #1118270d}.search input{border:0;outline:0;width:100%;font-size:16px}
.toolbar{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:14px}.chips,.filters{display:flex;gap:8px;flex-wrap:wrap}.chips{overflow:auto;flex-wrap:nowrap;padding-bottom:10px}.chip,button,select{border:1px solid #dfe3ea;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.chip{white-space:nowrap;border-radius:999px}.chip.active,.primary{background:#111827;color:#fff;border-color:#111827}.stats{display:flex;gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid #e7e9ef;border-radius:14px;padding:11px 16px}.stat strong{font-size:20px}.stat span{color:#718096;font-size:13px;margin-left:5px}.status{color:#667085;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:17px;min-height:220px;display:flex;flex-direction:column}.cardtop{display:flex;justify-content:space-between}.card h3{margin:0;font-size:18px}.fav{border:0;font-size:21px;padding:0;background:transparent}.desc{color:#667085;line-height:1.5;flex:1}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:11px;padding:5px 8px;background:#f0f2f5;border-radius:999px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.modal{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:16px;z-index:10}.modal.hidden{display:none}.modalbox{background:#fff;border-radius:20px;max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative}.close{position:absolute;right:12px;top:8px;border:0;font-size:30px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail{background:#f6f7fb;border-radius:10px;padding:12px}.detail small{display:block;color:#718096}.json{background:#111827;color:#dbeafe;padding:14px;border-radius:12px;overflow:auto;font-size:12px}footer{max-width:1180px;margin:auto;padding:20px 16px;border-top:1px solid #e7e9ef;display:flex;justify-content:space-between;color:#718096}footer a{color:inherit}
@media(max-width:850px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.brand small{display:none}.grid{grid-template-columns:1fr}.details{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">API</div><div><b>Public API Explorer</b><small>Discover useful public APIs</small></div></div><button id="random" class="primary">🎲 Random API</button></header>
<main>
<section class="hero"><div><div class="eyebrow">API DIRECTORY</div><h1>Find an API for your next project.</h1><p>Search, filter, favorite and inspect public APIs from one mobile-friendly dashboard.</p></div><div class="search">⌕ <input id="q" placeholder="Search APIs, categories or descriptions…"></div></section>
<section class="toolbar"><div id="chips" class="chips"></div><div class="filters"><select id="auth"><option value="">Any auth</option><option>No</option><option>apiKey</option><option>OAuth</option></select><select id="https"><option value="">HTTPS: any</option><option value="true">HTTPS only</option><option value="false">HTTP only</option></select><select id="cors"><option value="">CORS: any</option><option value="yes">CORS yes</option><option value="no">CORS no</option></select><button id="favs">★ Favorites <span id="fc">0</span></button></div></section>
<div class="stats"><div class="stat"><strong id="count">0</strong><span>results</span></div><div class="stat"><strong id="cats">0</strong><span>categories</span></div><div class="stat"><strong id="favstat">0</strong><span>favorites</span></div></div>
<div id="status" class="status">Loading catalog…</div><section id="grid" class="grid"></section>
</main>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" id="close">×</button><div id="modalbody"></div></div></div>
<footer><span>Public API Explorer</span><a href="https://github.com/public-apis/public-apis" target="_blank" rel="noreferrer">Source catalog ↗</a></footer>
<script>
const fallback=[
["Open-Meteo","Weather forecasts and historical weather data without an API key.","No",true,"yes","Weather","https://open-meteo.com/"],
["REST Countries","Country, currency, language and border data.","No",true,"yes","Countries","https://restcountries.com/"],
["PokéAPI","RESTful Pokémon data.","No",true,"yes","Games & Comics","https://pokeapi.co/"],
["CoinGecko","Cryptocurrency prices and market data.","apiKey",true,"yes","Cryptocurrency","https://www.coingecko.com/en/api"],
["Jikan","Unofficial MyAnimeList API for anime and manga.","No",true,"yes","Anime","https://jikan.moe/"],
["NASA APIs","NASA open data and imagery.","apiKey",true,"yes","Science","https://api.nasa.gov/"],
["TheMealDB","Free meal and recipe database.","No",true,"yes","Food & Drink","https://www.themealdb.com/api.php"],
["Open Library","Open library catalog for books and authors.","No",true,"yes","Books","https://openlibrary.org/developers/api"],
["Dog CEO","Random dog images and breed data.","No",true,"yes","Animals","https://dog.ceo/dog-api/"]
].map(x=>({name:x[0],description:x[1],auth:x[2],https:x[3],cors:x[4],category:x[5],link:x[6]}));
let data=[],cat="",onlyFav=false,favorites=JSON.parse(localStorage.getItem("paxFav")||"[]");
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){try{let r=await fetch("https://api.publicapis.org/entries");if(!r.ok)throw 0;let j=await r.json();data=(j.entries||[]).map(e=>({name:e.API,description:e.Description,auth:e.Auth||"No",https:e.HTTPS,cors:e.Cors||"unknown",category:e.Category||"Other",link:e.Link}))}catch(e){data=fallback}buildCats();render()}
function buildCats(){let cs=[...new Set(data.map(x=>x.category))].sort();$("cats").textContent=cs.length;$("chips").innerHTML='<button class="chip active" data-cat="">All</button>'+cs.slice(0,25).map(c=>'<button class="chip" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("");document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));render()})}
function filtered(){let q=$("q").value.toLowerCase(),a=$("auth").value,h=$("https").value,c=$("cors").value;return data.filter(x=>(!q||[x.name,x.description,x.category].join(" ").toLowerCase().includes(q))&&(!cat||x.category===cat)&&(!a||x.auth.toLowerCase()===a.toLowerCase())&&(!h||String(!!x.https)===h)&&(!c||(c==="yes"?String(x.cors).toLowerCase()==="yes":String(x.cors).toLowerCase()!=="yes"))&&(!onlyFav||favorites.includes(x.name)))}
function render(){let arr=filtered();$("count").textContent=arr.length;$("fc").textContent=favorites.length;$("favstat").textContent=favorites.length;$("status").textContent="Showing "+arr.length+" of "+data.length+" APIs";$("grid").innerHTML=arr.map(x=>'<article class="card"><div class="cardtop"><h3>'+esc(x.name)+'</h3><button class="fav" data-f="'+esc(x.name)+'">'+(favorites.includes(x.name)?"★":"☆")+'</button></div><p class="desc">'+esc(x.description)+'</p><div class="badges"><span class="badge">'+esc(x.category)+'</span><span class="badge">Auth: '+esc(x.auth)+'</span><span class="badge">'+(x.https?"HTTPS":"HTTP")+'</span><span class="badge">CORS: '+esc(x.cors)+'</span></div><div class="actions"><button data-d="'+data.indexOf(x)+'">Details</button><button class="primary" data-o="'+esc(x.link)+'">Open API ↗</button></div></article>').join("")||"<div class='status'>No matching APIs.</div>";document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{let n=b.dataset.f;favorites=favorites.includes(n)?favorites.filter(x=>x!==n):[...favorites,n];localStorage.setItem("paxFav",JSON.stringify(favorites));render()});document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>details(+b.dataset.d));document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>window.open(b.dataset.o,"_blank"))}
function details(i){let x=data[i];$("modalbody").innerHTML="<h2>"+esc(x.name)+"</h2><p>"+esc(x.description)+"</p><div class='details'><div class='detail'><small>Category</small>"+esc(x.category)+"</div><div class='detail'><small>Authentication</small>"+esc(x.auth)+"</div><div class='detail'><small>HTTPS</small>"+x.https+"</div><div class='detail'><small>CORS</small>"+esc(x.cors)+"</div></div><p><button id='openapi' class='primary'>Open website ↗</button></p><details><summary>Raw JSON</summary><pre class='json'>"+esc(JSON.stringify(x,null,2))+"</pre></details>";$("modal").classList.remove("hidden");$("openapi").onclick=()=>window.open(x.link,"_blank")}
$("q").oninput=render;["auth","https","cors"].forEach(id=>$(id).onchange=render);$("favs").onclick=()=>{onlyFav=!onlyFav;render()};$("random").onclick=()=>{if(data.length)details(Math.floor(Math.random()*data.length))};$("close").onclick=()=>$("modal").classList.add("hidden");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.add("hidden")};load();
</script>
</body></html>
